x-app-environment: &app-environment
  DB_DATABASE: ${DB_DATABASE:-tickfast}
  DB_USERNAME: ${DB_USERNAME:-root}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-20}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
  TOKEN_USER_COUNT: ${TOKEN_USER_COUNT:-5}
  TICKFAST_TOKEN_OUTPUT_DIR: ${TICKFAST_TOKEN_OUTPUT_DIR:-/home/app/.tickfast/credentials}

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-tickfast}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_HOST: "%"
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build: .
    environment:
      <<: *app-environment
      API_WORKERS: ${API_WORKERS:-4}
    volumes:
      - credentials-data:${TICKFAST_TOKEN_OUTPUT_DIR:-/home/app/.tickfast/credentials}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  burst:
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    profiles: ["tools"]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment: *app-environment
    volumes:
      - "${TICKFAST_CREDENTIALS_DIR:-${HOME}/.tickfast/credentials}:/credentials"
    depends_on:
      api:
        condition: service_healthy
    entrypoint: ["python", "-m", "scripts.burst"]

volumes:
  credentials-data:
  mysql-data: